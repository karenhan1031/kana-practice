<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>日文練習</title>
<style>
* { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
:root {
  --bg:#f0f4f8; --card:#fff; --card2:#e8edf3;
  --accent:#d63651; --accent-kata:#2563eb; --accent-vocab:#7c3aed;
  --correct:#16a34a; --wrong:#dc2626;
  --text:#111827; --muted:#6b7280;
}
html,body { height:100%; background:var(--bg); color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; overflow-x:hidden; }
.screen { display:none; flex-direction:column; min-height:100vh; padding-bottom:32px; animation:fadeIn 0.2s ease; }
.screen.active { display:flex; }
@keyframes fadeIn { from{opacity:0} to{opacity:1} }

/* Shared */
.header { display:flex; align-items:center; gap:12px; padding:16px 20px;
  border-bottom:1px solid #e2e8f0; background:var(--card);
  position:sticky; top:0; z-index:100; }
.header h1 { font-size:1.1rem; font-weight:600; flex:1; }
.back-btn { background:none; border:none; color:var(--text); font-size:1.5rem; cursor:pointer; padding:4px 8px; line-height:1; }
.type-toggle { display:flex; margin:16px 20px 0; background:var(--card2); border-radius:12px; padding:4px; }
.type-btn { flex:1; padding:10px; border:none; border-radius:8px; background:none; color:var(--muted); font-size:1rem; cursor:pointer; transition:all 0.2s; }
.type-btn.hira.active { background:var(--accent); color:#fff; font-weight:600; }
.type-btn.kata.active { background:var(--accent-kata); color:#fff; font-weight:600; }
.btn-primary { width:100%; padding:16px; border:none; border-radius:12px; font-size:1rem; font-weight:600;
  cursor:pointer; min-height:56px; transition:opacity 0.15s; color:#fff; }
.btn-primary:active { opacity:0.8; }
.btn-primary.hira  { background:var(--accent); }
.btn-primary.kata  { background:var(--accent-kata); }
.btn-primary.vocab { background:var(--accent-vocab); }
.btn-secondary { width:100%; padding:14px; background:var(--card); color:var(--text);
  border:1px solid #e2e8f0; border-radius:12px; font-size:1rem; cursor:pointer; min-height:56px; }
.bottom-actions { padding:0 20px; display:flex; flex-direction:column; gap:10px; margin-top:12px; }

/* Home */
.home-mode-toggle { display:flex; margin:16px 20px 0; background:var(--card2); border-radius:12px; padding:4px; }
.hm-btn { flex:1; padding:10px; border:none; border-radius:8px; background:none;
  color:var(--muted); font-size:0.95rem; cursor:pointer; transition:all 0.2s; }
.hm-btn.active-kana { background:var(--accent); color:#fff; font-weight:600; }
.hm-btn.active-vocab { background:var(--accent-vocab); color:#fff; font-weight:600; }
.row-grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; padding:16px 20px; }
.sec-label { grid-column:1/-1; font-size:0.7rem; color:var(--muted); text-transform:uppercase; letter-spacing:0.1em;
  padding:8px 4px 2px; border-top:1px solid #e2e8f0; margin-top:4px; }
.sec-label:first-child { border-top:none; margin-top:0; }
.row-btn { background:var(--card); border:1px solid #e2e8f0; border-radius:12px; padding:16px 10px;
  text-align:center; cursor:pointer; color:var(--text);
  transition:transform 0.1s, box-shadow 0.1s; box-shadow:0 1px 3px #0000000a; }
.row-btn:active { transform:scale(0.95); box-shadow:none; }
.row-name { font-size:1.25rem; font-weight:600; display:block; }
.row-stat { font-size:0.7rem; color:var(--muted); margin-top:5px; display:block; }
.row-stat.good { color:var(--correct); } .row-stat.bad { color:var(--wrong); }

/* Vocab lesson grid */
.lesson-grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; padding:16px 20px; }
.lesson-btn { background:var(--card); border:1px solid #e2e8f0; border-radius:12px; padding:14px 10px;
  text-align:center; cursor:pointer; color:var(--text);
  transition:transform 0.1s; box-shadow:0 1px 3px #0000000a; }
.lesson-btn:active { transform:scale(0.95); }
.lesson-num { font-size:1.1rem; font-weight:700; color:var(--accent-vocab); display:block; }
.lesson-title { font-size:0.72rem; color:var(--muted); margin-top:3px; display:block; white-space:nowrap;
  overflow:hidden; text-overflow:ellipsis; }
.lesson-stat { font-size:0.68rem; color:var(--muted); margin-top:4px; display:block; }
.lesson-stat.good { color:var(--correct); } .lesson-stat.bad { color:var(--wrong); }

/* Table */
.tbl-section { padding:0 20px 4px; }
.tbl-section-title { font-size:0.75rem; color:var(--muted); text-transform:uppercase; letter-spacing:0.08em;
  padding:16px 0 8px; border-top:1px solid #e2e8f0; margin-top:4px; }
.tbl-section:first-child .tbl-section-title { border-top:none; padding-top:16px; }
.kana-table { width:100%; border-collapse:collapse; }
.kana-table th,.kana-table td { text-align:center; padding:4px 2px; border:1px solid #e2e8f0; min-width:42px; }
.kana-table th { color:var(--muted); font-size:0.7rem; font-weight:400; background:#f8fafc; }
.kana-cell { display:flex; flex-direction:column; align-items:center; gap:1px; cursor:pointer; padding:5px 0; border-radius:6px; transition:background 0.15s; }
.kana-cell:active { background:#0000000a; }
.kana-cell.lit .k-char { color:var(--accent); }
.kana-cell.playing .k-char { color:var(--accent-kata); }
.k-char { font-size:1.3rem; line-height:1.2; }
.k-rom { font-size:0.6rem; color:var(--muted); }
.k-rom.arc { color:#b0b8c4; font-style:italic; }

/* Practice */
.practice-top { display:flex; align-items:center; gap:12px; padding:16px 20px;
  background:var(--card); border-bottom:1px solid #e2e8f0;
  position:sticky; top:0; z-index:100; }
.prog-wrap { flex:1; height:6px; background:var(--card2); border-radius:3px; overflow:hidden; }
.prog-fill { height:100%; background:var(--accent); border-radius:3px; transition:width 0.35s ease; }
.prog-fill.kata  { background:var(--accent-kata); }
.prog-fill.vocab { background:var(--accent-vocab); }
.prog-label { font-size:0.82rem; color:var(--muted); white-space:nowrap; }
.mode-tag { text-align:center; font-size:0.75rem; color:var(--muted); padding:8px 20px 4px; }
.q-area { flex:1; display:flex; align-items:center; justify-content:center;
  padding:20px; cursor:pointer; flex-direction:column; gap:8px; min-height:180px; }
.q-char { font-size:5rem; line-height:1; text-align:center; user-select:none; }
.q-text { font-size:2.4rem; font-weight:700; text-align:center; letter-spacing:0.05em; user-select:none; color:var(--accent); }
.q-vocab-jp { font-size:3rem; font-weight:700; text-align:center; user-select:none; line-height:1.2; }
.q-vocab-cn { font-size:1.5rem; font-weight:600; text-align:center; user-select:none; color:var(--accent-vocab); }
.q-hint { font-size:0.72rem; color:var(--muted); }
.choices { display:grid; grid-template-columns:1fr 1fr; gap:10px; padding:0 20px 20px; }
.choice-btn { padding:14px 8px; background:var(--card); border:1.5px solid #e2e8f0; border-radius:12px;
  color:var(--text); font-size:1.15rem; cursor:pointer; transition:all 0.15s;
  min-height:60px; line-height:1.3; box-shadow:0 1px 3px #0000000a; }
.choice-btn.vocab-choice { font-size:0.9rem; padding:12px 8px; }
.choice-btn:disabled { cursor:default; }
.choice-btn.correct { background:var(--correct) !important; color:#fff; border-color:var(--correct); }
.choice-btn.wrong   { background:var(--wrong)   !important; color:#fff; border-color:var(--wrong); }
.choice-btn.reveal  { background:var(--correct) !important; color:#fff; border-color:var(--correct); }

/* Result */
.result-score { text-align:center; padding:40px 20px 24px; }
.score-big { font-size:5rem; font-weight:700; line-height:1; color:var(--accent); }
.score-denom { font-size:1.6rem; color:var(--muted); }
.score-msg { font-size:1rem; color:var(--muted); margin-top:8px; }
.missed-wrap { padding:0 20px 8px; }
.missed-wrap h3 { font-size:0.85rem; color:var(--muted); margin-bottom:10px; }
.missed-item { display:flex; align-items:center; gap:14px; background:var(--card);
  border:1px solid #e2e8f0; border-radius:10px; padding:12px 16px; margin-bottom:8px;
  cursor:pointer; box-shadow:0 1px 3px #0000000a; }
.missed-item:active { opacity:0.7; }
.m-kana { font-size:1.5rem; min-width:2.5rem; text-align:center; }
.m-arrow { color:var(--muted); font-size:0.9rem; flex-shrink:0; }
.m-rom { font-size:0.9rem; color:var(--text); }

/* Vocab list */
.vl-lesson { padding:0 20px; }
.vl-lesson-hd { display:flex; align-items:center; justify-content:space-between;
  padding:14px 0 8px; border-bottom:2px solid var(--accent-vocab); margin-bottom:2px; cursor:pointer; }
.vl-lesson-hd-left { display:flex; align-items:baseline; gap:8px; }
.vl-lnum { font-size:1rem; font-weight:700; color:var(--accent-vocab); }
.vl-ltitle { font-size:0.8rem; color:var(--muted); }
.vl-toggle { font-size:0.8rem; color:var(--muted); }
.vl-words { }
.vl-word { display:flex; align-items:center; padding:9px 4px;
  border-bottom:1px solid #f0f0f0; cursor:pointer; gap:12px; }
.vl-word:active { background:#f8f8f8; border-radius:8px; }
.vl-jp-block { display:flex; flex-direction:column; min-width:7rem; }
.vl-jp { font-size:1.05rem; font-weight:600; }
.vl-rom { font-size:0.68rem; color:var(--accent-vocab); margin-top:1px; }
.vl-sep { color:var(--muted); font-size:0.85rem; flex-shrink:0; }
.vl-cn { font-size:0.9rem; color:var(--muted); flex:1; }
.vl-sound { font-size:0.8rem; color:var(--accent-vocab); flex-shrink:0; opacity:0.6; }

/* Speed btn */
.speed-btn { background:var(--card2); border:1px solid #e2e8f0; border-radius:20px;
  color:var(--muted); font-size:0.78rem; font-weight:600; padding:5px 11px;
  cursor:pointer; white-space:nowrap; flex-shrink:0; }
.speed-btn:active { opacity:0.7; }

/* Mute button */
.mute-btn { background:none; border:1px solid #e2e8f0; border-radius:20px;
  padding:4px 9px; font-size:0.95rem; cursor:pointer; color:var(--muted); flex-shrink:0; line-height:1.4; }
.mute-btn.muted { color:var(--wrong); border-color:var(--wrong); }

/* Vocab list sticky area */
.vl-sticky { position:sticky; top:57px; z-index:99; background:var(--card); }
.vl-search-wrap { padding:10px 20px; border-bottom:1px solid #e2e8f0; }
.vl-search { width:100%; padding:10px 14px; border:1.5px solid #e2e8f0; border-radius:10px;
  font-size:0.95rem; background:var(--bg); color:var(--text); outline:none; }
.vl-search:focus { border-color:var(--accent-vocab); }
.vl-nav { background:var(--card); border-bottom:1px solid #e2e8f0;
  padding:8px 20px; overflow-x:auto; display:flex; gap:8px; white-space:nowrap; }
.vl-nav::-webkit-scrollbar { display:none; }
.vl-nav-btn { background:var(--card2); border:none; border-radius:20px; padding:5px 12px;
  font-size:0.75rem; color:var(--muted); cursor:pointer; flex-shrink:0; transition:all 0.15s; }
.vl-nav-btn:active { background:var(--accent-vocab); color:#fff; }
.vl-wcount { font-size:0.68rem; color:var(--accent-vocab); font-weight:600; }
.vl-lesson { scroll-margin-top:170px; }
.vl-lesson-tag { font-size:0.68rem; color:var(--muted); flex-shrink:0;
  background:var(--card2); padding:2px 6px; border-radius:10px; }

/* Kana companion bar */
.kana-companion { position:fixed; bottom:0; left:0; right:0; background:var(--card);
  border-top:2px solid var(--accent-kata); padding:14px 20px;
  display:flex; align-items:center; justify-content:center; gap:16px;
  z-index:200; transform:translateY(100%); transition:transform 0.25s ease;
  box-shadow:0 -2px 16px #0000001a; }
.kana-companion.show { transform:translateY(0); }
.kana-comp-char { font-size:2.2rem; line-height:1; }
.kana-comp-alt { font-size:2.2rem; line-height:1; color:var(--accent-kata); }
.kana-comp-sep { color:var(--muted); font-size:1.2rem; }
.kana-comp-rom { font-size:0.85rem; color:var(--muted); min-width:3rem; text-align:center; }
.kana-comp-close { background:none; border:none; color:var(--muted); font-size:1rem;
  cursor:pointer; margin-left:8px; padding:4px; }

/* Practice records */
.worst-section { padding:16px 20px 8px; }
.worst-section h3 { font-size:0.78rem; color:var(--muted); text-transform:uppercase;
  letter-spacing:0.06em; margin-bottom:10px; }
.worst-chips { display:flex; flex-wrap:wrap; gap:8px; }
.worst-chip { background:var(--card); border:1px solid #fecaca; border-radius:10px;
  padding:8px 12px; display:flex; flex-direction:column; align-items:center;
  cursor:pointer; min-width:3rem; }
.wc-char { font-size:1.3rem; line-height:1.2; }
.wc-n { font-size:0.65rem; color:var(--wrong); margin-top:2px; }
.rec-session { background:var(--card); border:1px solid #e2e8f0; border-radius:12px;
  padding:12px 16px; margin-bottom:8px; }
.rec-meta { font-size:0.7rem; color:var(--muted); margin-bottom:4px; }
.rec-row { display:flex; align-items:center; justify-content:space-between; }
.rec-label-text { font-size:0.95rem; font-weight:600; }
.rec-pct { font-size:1rem; font-weight:700; }
.rec-pct.good { color:var(--correct); }
.rec-pct.bad { color:var(--wrong); }
.rec-missed { display:flex; flex-wrap:wrap; gap:5px; margin-top:7px; }
.rec-ch { background:var(--card2); border-radius:5px; padding:2px 7px; font-size:0.85rem; }
</style>
</head>
<body>

<!-- Home -->
<div id="s-home" class="screen active">
  <div class="header"><h1>日文練習</h1></div>
  <div class="home-mode-toggle">
    <button class="hm-btn active-kana" id="hm-kana" onclick="setHomeMode('kana')">五十音練習</button>
    <button class="hm-btn" id="hm-vocab" onclick="setHomeMode('vocab')">單字練習</button>
  </div>

  <!-- Kana section -->
  <div id="home-kana-section">
    <div class="type-toggle">
      <button class="type-btn hira active" id="home-hira" onclick="setKanaType('hiragana')">平假名　あ</button>
      <button class="type-btn kata"        id="home-kata" onclick="setKanaType('katakana')">片假名　ア</button>
    </div>
    <div class="row-grid" id="row-grid"></div>
    <div class="bottom-actions">
      <button class="btn-primary hira" id="all-btn" onclick="startKanaPractice(null)">全部隨機練習</button>
      <button class="btn-secondary" onclick="go('s-table')">查看五十音表</button>
      <button class="btn-secondary" onclick="go('s-records')">練習紀錄</button>
    </div>
  </div>

  <!-- Vocab section -->
  <div id="home-vocab-section" style="display:none">
    <div class="lesson-grid" id="lesson-grid"></div>
    <div class="bottom-actions">
      <button class="btn-primary vocab" onclick="startVocabPractice(null)">全課隨機練習</button>
      <button class="btn-secondary" onclick="go('s-vocab-list')">查看全部單字</button>
      <button class="btn-secondary" onclick="go('s-records')">練習紀錄</button>
    </div>
  </div>
</div>

<!-- Vocab List -->
<div id="s-vocab-list" class="screen">
  <div class="header">
    <button class="back-btn" onclick="go('s-home')">←</button>
    <h1>單字表</h1>
    <button class="mute-btn" id="mute-btn-vl" onclick="toggleMute()">🔊</button>
    <button class="speed-btn" onclick="cycleRate()">0.6x</button>
  </div>
  <div class="vl-sticky">
    <div class="vl-search-wrap">
      <input class="vl-search" id="vl-search" type="search" placeholder="搜尋單字（日文 / 中文）" oninput="searchVocab(this.value)">
    </div>
    <div class="vl-nav" id="vl-nav"></div>
  </div>
  <div id="vocab-list-container"></div>
</div>

<!-- Table -->
<div id="s-table" class="screen">
  <div class="header">
    <button class="back-btn" onclick="go('s-home')">←</button>
    <h1>五十音表</h1>
    <button class="mute-btn" id="mute-btn-tbl" onclick="toggleMute()">🔊</button>
    <button class="speed-btn" onclick="cycleRate()">0.6x</button>
  </div>
  <div class="type-toggle">
    <button class="type-btn hira active" id="tbl-hira" onclick="setTableType('hiragana')">平假名　あ</button>
    <button class="type-btn kata"        id="tbl-kata" onclick="setTableType('katakana')">片假名　ア</button>
  </div>
  <div id="table-container"></div>
  <div id="kana-companion" class="kana-companion">
    <span id="comp-main" class="kana-comp-char"></span>
    <span class="kana-comp-sep">↔</span>
    <span id="comp-alt" class="kana-comp-alt"></span>
    <span id="comp-rom" class="kana-comp-rom"></span>
    <button class="kana-comp-close" onclick="document.getElementById('kana-companion').classList.remove('show')">✕</button>
  </div>
</div>

<!-- Practice -->
<div id="s-practice" class="screen">
  <div class="practice-top">
    <button class="back-btn" onclick="go('s-home')">←</button>
    <div class="prog-wrap"><div class="prog-fill" id="prog-fill"></div></div>
    <span class="prog-label" id="prog-label">1 / 10</span>
    <button class="mute-btn" id="mute-btn-pr" onclick="toggleMute()">🔊</button>
    <button class="speed-btn" onclick="cycleRate()">0.6x</button>
  </div>
  <div class="mode-tag" id="mode-tag"></div>
  <div class="q-area" id="q-area" onclick="replayAudio()"></div>
  <div class="choices" id="choices"></div>
</div>

<!-- Result -->
<div id="s-result" class="screen">
  <div class="header"><h1>練習結果</h1></div>
  <div class="result-score">
    <div><span class="score-big" id="r-score">0</span><span class="score-denom" id="r-denom"> / 10</span></div>
    <div class="score-msg" id="r-msg"></div>
  </div>
  <div class="missed-wrap" id="missed-wrap"></div>
  <div class="bottom-actions">
    <button class="btn-primary hira" id="retry-btn" onclick="retry()">再練一次</button>
    <button class="btn-secondary" onclick="go('s-home')">回首頁</button>
  </div>
</div>

<!-- Records -->
<div id="s-records" class="screen">
  <div class="header">
    <button class="back-btn" onclick="go('s-home')">←</button>
    <h1>練習紀錄</h1>
    <button class="speed-btn" style="color:var(--wrong)" onclick="clearRecords()">清除</button>
  </div>
  <div id="records-container"></div>
</div>

<script>
// ── Speech ─────────────────────────────────────────────────────────────
const RATES = [0.4, 0.6, 0.8, 1.0];
const RATE_LABELS = ['0.4x', '0.6x', '0.8x', '1.0x'];
let speechRateIdx = parseInt(localStorage.getItem('kana_rate_idx') || '1');
let lastSpoken = '';
let muteMode = localStorage.getItem('kana_mute') === '1';
let _jaVoice = null;
function getBestJaVoice() {
  if (_jaVoice) return _jaVoice;
  const voices = window.speechSynthesis.getVoices();
  const ja = voices.filter(v => v.lang.startsWith('ja'));
  const prefs = ['Wavenet','Neural','Premium','Enhanced','Kyoko','Otoya','Google'];
  for (const p of prefs) {
    const v = ja.find(v => v.name.includes(p));
    if (v) { _jaVoice = v; return v; }
  }
  _jaVoice = ja[0] || null;
  return _jaVoice;
}
if (window.speechSynthesis) {
  speechSynthesis.onvoiceschanged = () => { _jaVoice = null; getBestJaVoice(); };
}
function speak(text) {
  lastSpoken = text;
  if (muteMode || !window.speechSynthesis) return;
  window.speechSynthesis.cancel();
  const utt = new SpeechSynthesisUtterance(text);
  utt.lang = 'ja-JP';
  utt.rate = RATES[speechRateIdx];
  const v = getBestJaVoice();
  if (v) utt.voice = v;
  window.speechSynthesis.speak(utt);
}
function replayAudio() { if (lastSpoken) speak(lastSpoken); }
function cycleRate() {
  speechRateIdx = (speechRateIdx + 1) % RATES.length;
  localStorage.setItem('kana_rate_idx', speechRateIdx);
  document.querySelectorAll('.speed-btn').forEach(b => b.textContent = RATE_LABELS[speechRateIdx]);
  if (lastSpoken) speak(lastSpoken);
}
function toggleMute() {
  muteMode = !muteMode;
  localStorage.setItem('kana_mute', muteMode ? '1' : '0');
  updateMuteBtns();
  if (muteMode) window.speechSynthesis?.cancel();
}
function updateMuteBtns() {
  document.querySelectorAll('.mute-btn').forEach(b => {
    b.textContent = muteMode ? '🔇' : '🔊';
    b.classList.toggle('muted', muteMode);
  });
}

// ── Kana Data ──────────────────────────────────────────────────────────

// Hiragana ↔ Katakana lookup
const HIRA_KATA_MAP = {}, KATA_HIRA_MAP = {};
ROWS.hiragana.forEach((hr, ri) => {
  const kr = ROWS.katakana[ri];
  if (!kr) return;
  hr.chars.forEach((hc, ci) => {
    const kc = kr.chars[ci];
    if (hc && kc) { HIRA_KATA_MAP[hc.k] = kc.k; KATA_HIRA_MAP[kc.k] = hc.k; }
  });
});

// ── Progress ───────────────────────────────────────────────────────────
function loadProg() { try { return JSON.parse(localStorage.getItem('kana_v3')||'{}'); } catch{return{};} }
function saveProg(ns, key, correct, total) {
  const p = loadProg();
  if (!p[ns]) p[ns] = {};
  if (!p[ns][key]) p[ns][key] = {practiced:0,correct:0,total:0};
  p[ns][key].practiced++; p[ns][key].correct+=correct; p[ns][key].total+=total;
  localStorage.setItem('kana_v3', JSON.stringify(p));
}
function statFor(ns, key) { return loadProg()[ns]?.[key] || null; }

// ── Nav ────────────────────────────────────────────────────────────────
function go(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  if (id === 's-home')       { homeMode==='kana' ? renderKanaHome() : renderVocabHome(); }
  if (id === 's-table')      renderTable();
  if (id === 's-vocab-list') renderVocabList();
  if (id === 's-records')    renderRecords();
}

// ── Home ───────────────────────────────────────────────────────────────
function setHomeMode(mode) {
  homeMode = mode;
  document.getElementById('hm-kana').className  = 'hm-btn' + (mode==='kana'  ? ' active-kana'  : '');
  document.getElementById('hm-vocab').className = 'hm-btn' + (mode==='vocab' ? ' active-vocab' : '');
  document.getElementById('home-kana-section').style.display  = mode==='kana'  ? '' : 'none';
  document.getElementById('home-vocab-section').style.display = mode==='vocab' ? '' : 'none';
  if (mode==='kana') renderKanaHome(); else renderVocabHome();
}

const CAT_LABELS = { seion:'清音', dakuten:'濁音・半濁音', yoon:'拗音' };

function setKanaType(type) {
  currentType = type;
  document.getElementById('home-hira').classList.toggle('active', type==='hiragana');
  document.getElementById('home-kata').classList.toggle('active', type==='katakana');
  document.getElementById('all-btn').className = `btn-primary ${type==='hiragana'?'hira':'kata'}`;
  renderKanaHome();
}

function renderKanaHome() {
  const prog = loadProg(); const grid = document.getElementById('row-grid');
  grid.innerHTML = ''; let lastCat = null;
  ROWS[currentType].forEach(({row,cat}) => {
    if (cat !== lastCat) {
      const lbl = document.createElement('div'); lbl.className='sec-label';
      lbl.textContent = CAT_LABELS[cat]; grid.appendChild(lbl); lastCat=cat;
    }
    const stat = prog['kana_'+currentType]?.[row];
    let txt='尚未練習', cls='';
    if (stat?.total>0) {
      const pct=Math.round(stat.correct/stat.total*100);
      txt=`${pct}% · ${stat.practiced}次`; cls=pct>=80?'good':pct<60?'bad':'';
    }
    const btn=document.createElement('button'); btn.className='row-btn';
    btn.innerHTML=`<span class="row-name">${row}</span><span class="row-stat ${cls}">${txt}</span>`;
    btn.onclick=()=>startKanaPractice(row); grid.appendChild(btn);
  });
}

function renderVocabHome() {
  const prog = loadProg(); const grid = document.getElementById('lesson-grid');
  grid.innerHTML = '';
  LESSONS.forEach(({l, title, words}) => {
    const key = 'vocab_'+l;
    const stat = prog[key];
    let txt='尚未練習', cls='';
    if (stat?.total>0) {
      const pct=Math.round(stat.correct/stat.total*100);
      txt=`${pct}% · ${stat.practiced}次`; cls=pct>=80?'good':pct<60?'bad':'';
    }
    const btn=document.createElement('button'); btn.className='lesson-btn';
    btn.innerHTML=`<span class="lesson-num">第${l}課</span><span class="lesson-title">${title}</span><span class="lesson-stat ${cls}">${txt}</span>`;
    btn.onclick=()=>startVocabPractice(l); grid.appendChild(btn);
  });
}

function setTableType(type) {
  tableType=type;
  document.getElementById('tbl-hira').classList.toggle('active', type==='hiragana');
  document.getElementById('tbl-kata').classList.toggle('active', type==='katakana');

function makeTblCell(c) {
  if (!c) return '<td></td>';
  const rc = c.arc?' arc':'';
  const rl = c.arc?`${c.r}*`:c.r;
  return `<td><div class="kana-cell" onclick="tblClick(this,'${c.k}')">
    <span class="k-char">${c.k}</span><span class="k-rom${rc}">${rl}</span>
  </div></td>`;
}
function makeTable(layout, cols) {
  const hdr = cols===5
    ? '<th></th><th>a</th><th>i</th><th>u</th><th>e</th><th>o</th>'
    : '<th></th><th>ya</th><th>yu</th><th>yo</th>';
  let h=`<table class="kana-table"><thead><tr>${hdr}</tr></thead><tbody>`;
  layout.forEach(({label,cells})=>{
    h+=`<tr><th>${label}</th>`;
    cells.forEach(c=>{ h+=makeTblCell(c); }); h+='</tr>';
  });
  return h+'</tbody></table>';
}
function renderTable() {
  const t=tableType;

}

  document.querySelectorAll('.kana-cell.lit').forEach(e=>e.classList.remove('lit'));

    document.getElementById('kana-companion').classList.add('show');
  }

// ── Helpers ────────────────────────────────────────────────────────────
function shuffle(arr) {
  for (let i=arr.length-1;i>0;i--) {
    const j=Math.floor(Math.random()*(i+1)); [arr[i],arr[j]]=[arr[j],arr[i]];
  }
  return arr;
}
function allKanaChars(type) {
  return ROWS[type||currentType].flatMap(r=>
    r.chars.filter(c=>c.p!==false).map(c=>({...c,row:r.row,cat:r.cat}))
  );
}

// ── Kana Practice ──────────────────────────────────────────────────────
function buildKanaQuestions(pool) {
  const count = pool.length<=3 ? pool.length*2 : 10;
  const base = shuffle([...pool]);
  return shuffle(Array.from({length:count},(_,i)=>({
    char: base[i%base.length],
    mode: Math.random()<0.5 ? 'reading' : 'writing'
  })));
}
function startKanaPractice(rowName) {
  const rowDef = rowName ? ROWS[currentType].find(r=>r.row===rowName) : null;
  const pool = rowName
    ? (rowDef?.chars.filter(c=>c.p!==false).map(c=>({...c,row:rowName,cat:rowDef.cat}))||[])
    : allKanaChars();
  if (!pool.length) return;
  session = {
    isVocab:false, type:currentType, rowName,
    questions:buildKanaQuestions(pool), index:0, score:0, missed:[]
  };
  const isHira = currentType==='hiragana';
  document.getElementById('prog-fill').className = `prog-fill ${isHira?'':'kata'}`;
  document.getElementById('retry-btn').className  = `btn-primary ${isHira?'hira':'kata'}`;
  go('s-practice'); renderQuestion();
}

// ── Vocab Practice ─────────────────────────────────────────────────────
function buildVocabQuestions(pool) {
  const count = Math.min(10, pool.length);
  const base = shuffle([...pool]);
  return shuffle(Array.from({length:count},(_,i)=>({
    char: base[i%base.length],
    mode: Math.random()<0.5 ? 'reading' : 'writing'
    // reading: show JP → choose CN
    // writing: show CN → choose JP
  })));
}
function startVocabPractice(lessonNum) {
  const pool = lessonNum
    ? (LESSONS.find(l=>l.l===lessonNum)?.words.map(w=>({...w,lesson:lessonNum}))||[])
    : LESSONS.flatMap(l=>l.words.map(w=>({...w,lesson:l.l})));
  if (!pool.length) return;
  session = {
    isVocab:true, lessonNum,
    questions:buildVocabQuestions(pool), index:0, score:0, missed:[]
  };
  document.getElementById('prog-fill').className = 'prog-fill vocab';
  document.getElementById('retry-btn').className  = 'btn-primary vocab';
  go('s-practice'); renderQuestion();
}

// ── Render Question ─────────────────────────────────────────────────────
let speakTimer = null;
function renderQuestion() {
  const {questions, index, isVocab} = session;
  const total = questions.length;
  const q = questions[index];
  document.getElementById('prog-fill').style.width = `${(index/total)*100}%`;
  document.getElementById('prog-label').textContent = `${index+1} / ${total}`;

  if (isVocab) renderVocabQuestion(q);
  else         renderKanaQuestion(q);

  clearTimeout(speakTimer);
  speakTimer = setTimeout(()=>speak(q.char.k), 400);
}

function renderKanaQuestion(q) {
  document.getElementById('mode-tag').textContent =
    q.mode==='reading' ? '認字模式 — 看假名，選出讀音' : '識字模式 — 看讀音，選出假名';
  document.getElementById('q-area').innerHTML = q.mode==='reading'
    ? `<div class="q-char">${q.char.k}</div><div class="q-hint">點此重播發音</div>`
    : `<div class="q-text">${q.char.r}</div><div class="q-hint">點此重播發音</div>`;

  const all = allKanaChars();
  const sameCat = all.filter(c=>c.cat===q.char.cat && c.r!==q.char.r);
  const dist = shuffle(sameCat.length>=3 ? sameCat : all.filter(c=>c.r!==q.char.r)).slice(0,3);
  const choices = shuffle([q.char, ...dist]);

  const el = document.getElementById('choices'); el.innerHTML='';
  choices.forEach(ch=>{
    const btn=document.createElement('button'); btn.className='choice-btn';
    btn.textContent = q.mode==='reading' ? ch.r : ch.k;
    btn.onclick=()=>answer(btn, ch, q, el, false);
    el.appendChild(btn);
  });
}

function renderVocabQuestion(q) {
  document.getElementById('mode-tag').textContent =
    q.mode==='reading' ? '單字模式 — 看日文，選出中文意思' : '單字模式 — 看中文，選出日文';
  document.getElementById('q-area').innerHTML = q.mode==='reading'
    ? `<div class="q-vocab-jp">${q.char.k}</div><div class="q-hint">點此重播發音</div>`
    : `<div class="q-vocab-cn">${q.char.m}</div><div class="q-hint">點此重播發音</div>`;

  // distractors: prefer same lesson
  const all = session.lessonNum
    ? (LESSONS.find(l=>l.l===session.lessonNum)?.words||[])
    : LESSONS.flatMap(l=>l.words);
  const dist = shuffle(all.filter(w=>w.k!==q.char.k)).slice(0,3);
  const choices = shuffle([q.char, ...dist]);

  const el=document.getElementById('choices'); el.innerHTML='';
  choices.forEach(ch=>{
    const btn=document.createElement('button'); btn.className='choice-btn vocab-choice';
    btn.textContent = q.mode==='reading' ? ch.m : ch.k;
    btn.onclick=()=>answer(btn, ch, q, el, true);
    el.appendChild(btn);
  });
}

// ── Answer ─────────────────────────────────────────────────────────────
function answer(btn, chosen, q, choicesEl, isVocab) {
  choicesEl.querySelectorAll('.choice-btn').forEach(b=>b.disabled=true);
  let isCorrect;
  if (isVocab) {
    isCorrect = q.mode==='reading' ? chosen.m===q.char.m : chosen.k===q.char.k;
  } else {
    isCorrect = q.mode==='reading' ? chosen.r===q.char.r : chosen.k===q.char.k;
  }
  if (isCorrect) { btn.classList.add('correct'); session.score++; }
  else {
    btn.classList.add('wrong');
    const cv = isVocab ? (q.mode==='reading' ? q.char.m : q.char.k)
                       : (q.mode==='reading' ? q.char.r : q.char.k);
    choicesEl.querySelectorAll('.choice-btn').forEach(b=>{ if(b.textContent===cv) b.classList.add('reveal'); });
    session.missed.push(q.char);
  }
  speak(q.char.k);
  setTimeout(()=>{
    session.index++;
    session.index>=session.questions.length ? finishPractice() : renderQuestion();
  }, 1000);
}

// ── Finish ─────────────────────────────────────────────────────────────
function finishPractice() {
  saveRecord(session);
  if (session.isVocab && session.lessonNum)
    saveProg('vocab_'+session.lessonNum, 'vocab_'+session.lessonNum, session.score, session.questions.length);
  else if (!session.isVocab && session.rowName)
    saveProg('kana_'+session.type, session.rowName, session.score, session.questions.length);

  const total=session.questions.length;
  const pct=Math.round(session.score/total*100);
  document.getElementById('r-score').textContent = session.score;
  document.getElementById('r-denom').textContent = ` / ${total}`;
  document.getElementById('r-msg').textContent =
    pct===100?'完美，全對！':pct>=80?'很不錯！繼續保持':pct>=60?'不錯，再練幾次更紮實':'多練幾次，你可以的！';

  const el=document.getElementById('missed-wrap');
  if (!session.missed.length) {
    el.innerHTML='<p style="text-align:center;color:var(--muted);padding:20px 0">全部答對！</p>';
  } else {
    const unique=[...new Map(session.missed.map(m=>[m.k,m])).values()];
    el.innerHTML='<h3>答錯的字</h3>'+unique.map(m=>{
      const sub = session.isVocab ? m.m : m.r;
      return `<div class="missed-item" onclick="speak('${m.k}')">
        <span class="m-kana">${m.k}</span>
        <span class="m-arrow">↔</span>
        <span class="m-rom">${sub}</span>
      </div>`;
    }).join('');
  }
  go('s-result');
}

function retry() {
  if (session.isVocab) { currentType='hiragana'; startVocabPractice(session.lessonNum); }
  else { currentType=session.type; startKanaPractice(session.rowName); }
}

// ── Vocab List ─────────────────────────────────────────────────────────
const collapsedLessons = new Set();

function renderVocabList() {
  const searchEl = document.getElementById('vl-search');
  if (searchEl) searchEl.value = '';
  const nav = document.getElementById('vl-nav');
  nav.style.display = '';
  nav.innerHTML = LESSONS.map(({l}) =>
    `<button class="vl-nav-btn" onclick="scrollToLesson(${l})">L${l}</button>`
  ).join('');
  renderVocabListContent('');
}
function renderVocabListContent(q) {
  const container = document.getElementById('vocab-list-container');
  const ql = q.toLowerCase();
  if (ql) {
    const results = [];
    LESSONS.forEach(({l, words}) => {
      words.forEach(w => {
        if (w.k.toLowerCase().includes(ql) || w.r.toLowerCase().includes(ql) || w.m.includes(ql))
          results.push({...w, lesson:l});
      });
    });
    if (!results.length) {
      container.innerHTML = `<p style="text-align:center;color:var(--muted);padding:40px 20px">找不到「${q}」</p>`;
      return;
    }
    container.innerHTML = results.map(w =>
      `<div class="vl-word" style="padding:9px 20px" onclick="speak('${w.k.replace(/'/g,"\\'")}')">
        <div class="vl-jp-block">
          <span class="vl-jp">${hlMatch(w.k,ql)}</span>
          <span class="vl-rom">${w.r}</span>
        </div>
        <span class="vl-sep">→</span>
        <span class="vl-cn">${hlMatch(w.m,ql)}</span>
        <span class="vl-lesson-tag">L${w.lesson}</span>
        <span class="vl-sound">♪</span>
      </div>`
    ).join('');
    return;
  }
  container.innerHTML = LESSONS.map(({l, title, words}) => {
    const isOpen = !collapsedLessons.has(l);
    const wordRows = words.map(w =>
      `<div class="vl-word" onclick="speak('${w.k.replace(/'/g,"\\'")}')">
        <div class="vl-jp-block">
          <span class="vl-jp">${w.k}</span>
          <span class="vl-rom">${w.r}</span>
        </div>
        <span class="vl-sep">→</span>
        <span class="vl-cn">${w.m}</span>
        <span class="vl-sound">♪</span>
      </div>`
    ).join('');
    return `<div class="vl-lesson" id="vl-lesson-${l}">
      <div class="vl-lesson-hd" onclick="toggleLesson(${l})">
        <div class="vl-lesson-hd-left">
          <span class="vl-lnum">第${l}課</span>
          <span class="vl-ltitle">${title}</span>
          <span class="vl-wcount">${words.length}語</span>
        </div>
        <span class="vl-toggle" id="vl-toggle-${l}">${isOpen ? '▲' : '▼'}</span>
      </div>
      <div class="vl-words" id="vl-words-${l}" style="display:${isOpen?'block':'none'}">${wordRows}</div>
    </div>`;
  }).join('');
}
function hlMatch(text, q) {
  if (!q) return text;
  const i = text.toLowerCase().indexOf(q);
  if (i < 0) return text;
  return text.slice(0,i) + `<mark style="background:#fef08a;border-radius:2px;padding:0 1px">${text.slice(i,i+q.length)}</mark>` + text.slice(i+q.length);
}
function searchVocab(query) {
  const q = query.trim();
  document.getElementById('vl-nav').style.display = q ? 'none' : '';
  renderVocabListContent(q);
}

function toggleLesson(l) {
  if (collapsedLessons.has(l)) collapsedLessons.delete(l);
  else collapsedLessons.add(l);
  const el = document.getElementById('vl-words-'+l);
  const arrow = document.getElementById('vl-toggle-'+l);
  const isOpen = !collapsedLessons.has(l);
  el.style.display = isOpen ? 'block' : 'none';
  arrow.textContent = isOpen ? '▲' : '▼';
}
function scrollToLesson(l) {
  const el = document.getElementById('vl-lesson-'+l);
  if (el) el.scrollIntoView({behavior:'smooth', block:'start'});
}

// ── Practice Records ───────────────────────────────────────────────────
function loadRecords() {
  try { return JSON.parse(localStorage.getItem('kana_records') || '{"sessions":[]}'); }
  catch { return {sessions:[]}; }
}
function saveRecord(sess) {
  const records = loadRecords();
  const label = sess.isVocab
    ? (sess.lessonNum ? `第${sess.lessonNum}課` : '全課')
    : (sess.rowName || '全部');
  records.sessions.unshift({
    date: new Date().toLocaleString('zh-TW', {month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'}),
    type: sess.isVocab ? 'vocab' : 'kana_'+sess.type,
    label,
    score: sess.score,
    total: sess.questions.length,
    missed: [...new Set(sess.missed.map(m => m.k))]
  });
  records.sessions = records.sessions.slice(0, 50);
  localStorage.setItem('kana_records', JSON.stringify(records));
}
function clearRecords() {
  if (!confirm('確定清除所有練習紀錄？')) return;
  localStorage.removeItem('kana_records');
  renderRecords();
}
function renderRecords() {
  const records = loadRecords();
  const container = document.getElementById('records-container');
  if (!records.sessions.length) {
    container.innerHTML = '<p style="text-align:center;color:var(--muted);padding:40px 20px">尚無練習紀錄</p>';
    return;
  }
  const freq = {};
  records.sessions.forEach(s => s.missed.forEach(ch => { freq[ch] = (freq[ch]||0)+1; }));
  const top = Object.entries(freq).sort((a,b) => b[1]-a[1]).slice(0,12);
  let html = '';
  if (top.length) {
    html += '<div class="worst-section"><h3>最常答錯</h3><div class="worst-chips">';
    top.forEach(([ch,n]) => {
      html += `<div class="worst-chip" onclick="speak('${ch.replace(/'/g,"\\'")}')"><span class="wc-char">${ch}</span><span class="wc-n">${n}次</span></div>`;
    });
    html += '</div></div>';
  }
  html += `<div style="padding:12px 20px 6px"><span style="font-size:0.75rem;color:var(--muted)">近期練習（共 ${records.sessions.length} 次）</span></div><div style="padding:0 20px 32px">`;
  records.sessions.forEach(s => {
    const pct = Math.round(s.score/s.total*100);
    const pc = pct>=80?'good':pct<60?'bad':'';
    const tl = s.type.includes('vocab') ? '單字' : (s.type.includes('hiragana') ? '平假名' : '片假名');
    html += `<div class="rec-session">
      <div class="rec-meta">${s.date} · ${tl}</div>
      <div class="rec-row"><span class="rec-label-text">${s.label}</span><span class="rec-pct ${pc}">${pct}% <small style="font-weight:400;font-size:0.8rem">${s.score}/${s.total}</small></span></div>
      ${s.missed.length ? `<div class="rec-missed">${s.missed.slice(0,8).map(ch=>`<span class="rec-ch">${ch}</span>`).join('')}${s.missed.length>8?`<span class="rec-ch" style="color:var(--muted)">+${s.missed.length-8}</span>`:''}</div>` : ''}
    </div>`;
  });
  html += '</div>';
  container.innerHTML = html;
}

renderKanaHome();
document.querySelectorAll('.speed-btn').forEach(b=>{ b.textContent=RATE_LABELS[speechRateIdx]; });
